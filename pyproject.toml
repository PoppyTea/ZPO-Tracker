[project]
name = "zpo-tracker"
version = "0.1.0"
description = "Modernizacja procesu wprowadzania danych kurier/ZPO (Poczta Polska)"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.0",
    # Eksporty z BaŚKi przychodzą w starym formacie .xls (OLE2), którego
    # openpyxl nie otwiera W OGÓLE - to inny format pliku, nie kwestia
    # wersji. xlrd 2.x obsługuje wyłącznie .xls, więc nie ma ryzyka, że
    # przejmie obsługę .xlsx. Patrz src/zpo_tracker/arkusze.py.
    "xlrd>=2.0",
]

[project.scripts]
zpo-tracker = "zpo_tracker.gui.app:main"

[project.optional-dependencies]
# xlwt tylko do testów: xlrd wyłącznie CZYTA, więc bez zapisu
# nie dałoby się WYTWORZYĆ pliku .xls i testy sprawdzałyby
# podłożony artefakt zamiast realnego kształtu formatu.
dev = ["pytest>=8.0", "xlwt>=1.3"]
build = ["pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
markers = [
    "slow: testy skali (dziesiątki tysięcy wierszy) - pomijalne przez -m 'not slow'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
