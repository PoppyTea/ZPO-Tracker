[project]
name = "zpo-tracker"
version = "0.1.0"
description = "Modernizacja procesu wprowadzania danych kurier/ZPO (Poczta Polska)"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.0",
]

[project.scripts]
zpo-tracker = "zpo_tracker.gui.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
markers = [
    "slow: testy skali (dziesiątki tysięcy wierszy) - pomijalne przez -m 'not slow'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
